spring:
  application:
    name: ticketbooking

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketbooking}
    username: ${DB_USER:ticketbooking}
    password: ${DB_PASSWORD:ticketbooking}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoint:
    health:
      show-details: always

jwt:
  # HS256 needs at least 32 bytes. The default is for local development only.
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-real-deployments-0123456789}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

holds:
  # How long a seat hold lasts before Redis frees the seat
  ttl-seconds: ${HOLD_TTL_SECONDS:300}
  # Hold attempts allowed per user per window
  rate-limit:
    max-attempts: ${HOLD_RATE_LIMIT_MAX:10}
    window-seconds: ${HOLD_RATE_LIMIT_WINDOW_SECONDS:60}

admin:
  # No defaults on purpose: without both env vars, no admin account is created
  email: ${ADMIN_EMAIL:admin@gmail.com}
  password: ${ADMIN_PASSWORD:admin123}
